name: Site de test SIS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituer le site
        run: |
          ls site.tar.xz.part* >/dev/null 2>&1 || { echo "Les fichiers site.tar.xz.part00, part01, part02 manquent encore."; exit 1; }
          mkdir -p _site
          cat site.tar.xz.part* | tar -xJf - -C _site
          test -f _site/index.html
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
